# Source registry for the intelligence agents (#271, #352). Summary: sources.md. Only `valid` is
# polled; `pilotRank` marks the daily pilot; `fetchStrategy` is `direct` unless stated.
version: 1
checkedOn: '2026-10-24'
sources:
  - id: legistar-events
    name: City of Madison meetings (Legistar API)
    owner: City of Madison Clerk's Office (Legistar, by Granicus)
    canonicalUrl: https://madison.legistar.com/Calendar.aspx
    feedUrl: "https://webapi.legistar.com/v1/madison/events?$filter=EventDate%20ge%20datetime'{from}'%20and%20EventDate%20lt%20datetime'{to}'&$orderby=EventDate%20asc"
    format: json-api
    scope: Every public meeting of the Common Council, boards, commissions and committees
    audiences: [everyone, association-leaders, volunteers]
    reliability: official
    access: Public records API, no key. One windowed request per run.
    cadence: daily
    lastChecked: '2026-10-24'
    result: valid
    pilotRank: 1
    treatment: >-
      A 14-day window; dedupe on EventId, a newer EventLastModifiedUtc is an update, "Cancelled"
      is a cancellation. Pass Common Council meetings and public hearings to curate; drop other
      bodies unless an agenda item names a place in the area (coverage.md).
    example:
      title: TRANSPORTATION COMMISSION, 5:00 PM, Virtual
      date: '2026-10-28'
      url: https://madison.legistar.com/MeetingDetail.aspx?LEGID=28977&GID=205&G=D66739FE-4C3C-468C-A9F0-0198EFAA8EF8
    notes: >-
      Unfiltered queries return placeholder meetings up to 2050: always filter by date. Event 28745
      (2026-11-03) is Cancelled, "Rescheduled to 10/28/2026", matching event 29306.
  - id: legistar-matters
    name: City of Madison legislation (Legistar API)
    owner: City of Madison Clerk's Office (Legistar, by Granicus)
    canonicalUrl: https://madison.legistar.com/Legislation.aspx
    feedUrl: "https://webapi.legistar.com/v1/madison/matters?$filter=MatterLastModifiedUtc%20gt%20datetime'{cursor}'&$orderby=MatterLastModifiedUtc%20desc"
    format: json-api
    scope: Ordinances, resolutions and other items before the Council and its committees
    audiences: [everyone, association-leaders]
    reliability: official
    access: Public records API, no key.
    cadence: daily
    lastChecked: '2026-10-24'
    result: valid
    pilotRank: 3
    treatment: >-
      Items changed since the cursor whose title names a place in the area (coverage.md). Match
      text on our side: a substringof() filter on MatterTitle returned a server error.
    example:
      title: MatterId 103134, file 95368, Proposed 2027 Transportation budgets
      date: '2026-10-23'
      url: https://webapi.legistar.com/v1/madison/matters/103134
  - id: mpl-pinney-events
    name: Madison Public Library, Pinney Library events (iCalendar)
    owner: Madison Public Library
    canonicalUrl: https://www.madisonpubliclibrary.org/spaces/events/calendar-subscription-feeds
    feedUrl: https://www.madisonpubliclibrary.org/events/calendar/library/1940/export.ics
    format: ics
    scope: Programs at Pinney Library, the branch nearest the area, plus system-wide closures
    audiences: [families, youth, seniors, everyone]
    reliability: official
    access: Published by the library for public calendar subscription; no terms stated for the feed.
    cadence: daily
    lastChecked: '2026-10-24'
    result: valid
    pilotRank: 2
    treatment: >-
      iCalendar parser; dedupe on UID, a newer LAST-MODIFIED is an update. Keep only DTSTART from
      today on. Events have no URL property: link the event page from DESCRIPTION when present.
    example:
      title: Silent Book Club (UID f893db74-0646-428d-8d98-4568227a4399, 19:00 America/Chicago)
      date: '2026-11-17'
      url: https://www.madisonpubliclibrary.org/events/calendar/library-type/1940/237/export.ics
    notes: >-
      The check tool cut the all-events file (~89,000 characters) off in May 2026. The Book
      Discussion feed was read whole (to 2026-12-15). #272 logs a future all-events UID first.
  - id: madison365-news
    name: Madison365 (RSS)
    owner: Madison365 (nonprofit newsroom)
    canonicalUrl: https://madison365.com/
    feedUrl: https://madison365.com/feed/
    format: rss
    scope: Madison community, culture and civic news
    audiences: [everyone]
    reliability: established-media
    access: Copyrighted news. Use the headline, link and our own summary; never copy the article.
    cadence: daily
    lastChecked: '2026-10-24'
    result: valid
    pilotRank: 4
    treatment: >-
      Dedupe on guid. Most items are citywide or elsewhere: keep only items with a clear benefit to
      area residents (coverage.md). None of the 10 items on 2026-10-24 named the area.
    example:
      title: Five Latino artists selected for LOUD 2026 Micaela Salinas Artist Fellowship
