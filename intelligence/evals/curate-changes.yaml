      id: 41
      externalId: 'mpl-pinney-events:f893db74-0646-428d-8d98-4568227a4399'
      contentHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      status: active
