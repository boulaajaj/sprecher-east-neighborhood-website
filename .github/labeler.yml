frontend:
  - changed-files:
      - any-glob-to-any-file:
          ['src/app/**', 'src/modules/*/ui/**', 'src/platform/ui/**', 'src/platform/richtext/**']

cms:
  - changed-files:
      - any-glob-to-any-file:
          [
            'src/payload.config.ts',
            'src/modules/*/cms/**',
            'src/platform/payload/**',
            'src/app/(payload)/**',
          ]

auth:
  - changed-files:
      - any-glob-to-any-file: ['src/modules/accounts/**', 'src/modules/verification/**']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md', 'CLAUDE.md', '.claude/**', '.agents/**']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', 'package-lock.json', '.npmrc']

styling:
  - changed-files:
      - any-glob-to-any-file:
          ['src/app/(frontend)/globals.css', 'tailwind.config.*', 'postcss.config.*']

config:
  - changed-files:
      - any-glob-to-any-file:
          ['*.config.*', '.prettierrc', '.eslintrc*', 'eslint.config.*', 'tsconfig.json']

process:
  - changed-files:
      - any-glob-to-any-file:
          [
            'AGENTS.md',
            'CONTRIBUTING.md',
            'CLAUDE.md',
            '.agents/**',
            '.claude/**',
            'docs/guidelines/**',
            'docs/roles/**',
            '.github/ISSUE_TEMPLATE/**',
            '.github/pull_request_template.md',
            '.github/workflows/pr-policy.yml',
            '.github/workflows/issue-labels.yml',
            '.github/workflows/issue-fix-summary.yml',
          ]

# A "watch out" marker (#447): the change reaches every page that uses this code
shared-component:
  - changed-files:
      - any-glob-to-any-file:
          [
            'src/platform/ui/**',
            'src/platform/richtext/**',
            'src/platform/theme/**',
            'src/themes/**',
            'src/platform/lib/**',
          ]
