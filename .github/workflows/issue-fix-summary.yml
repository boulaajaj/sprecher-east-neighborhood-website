name: Issue Fix Summary

# When a PR is merged, comment on each issue it links with how it was fixed, so the
# issue itself records both the problem and the fix (AGENTS.md step 5).
# pull_request_target is safe here: no code is checked out or run, only the event payload
# is read, and it lets the comment work for PRs from forks too.

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  issues: write

jobs:
  summarize:
    name: Record fix on linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const numbers = (re) => [...new Set([...body.matchAll(re)].map((m) => Number(m[1])))];
            const closes = numbers(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)\b/gi);
            const partOf = numbers(/\bpart of:?\s+#(\d+)\b/gi).filter((n) => !closes.includes(n));
            if (closes.length + partOf.length === 0) {
              core.info('No linked issues.');
              return;
            }

            const sections = {};
            for (const part of body.split(/^##\s+/m).slice(1)) {
              const nl = part.indexOf('\n');
              const title = (nl === -1 ? part : part.slice(0, nl)).trim().toLowerCase();
              sections[title] = (nl === -1 ? '' : part.slice(nl + 1)).trim();
            }
            const pick = (name) => sections[name] || '_(not provided)_';
            const comment = (heading) =>
              [
                heading,
                `Merged into \`main\` as ${pr.merge_commit_sha}. Code changes deploy to production automatically (the CI run's "Deploy / …" jobs).`,
                '',
                '**What changed**',
                pick('what changed'),
                '',
                '**How it was fixed**',
                pick('how'),
              ].join('\n');

            const targets = [
              ...closes.map((n) => [n, comment(`### Fixed by #${pr.number}`)]),
              ...partOf.map((n) => [n, comment(`### Progress: #${pr.number} merged (issue stays open)`)]),
            ];
            for (const [number, text] of targets) {
              try {
                await github.rest.issues.createComment({ ...context.repo, issue_number: number, body: text });
                core.info(`Commented on #${number}`);
              } catch (e) {
                core.warning(`Could not comment on #${number}: ${e.message}`);
              }
            }
