name: Issue Fix Summary

# When a PR is merged, comment on each issue it links with how it was fixed, so the
# issue itself records both the problem and the fix (AGENTS.md step 5).
# pull_request_target is safe here because it runs only code from the trusted base branch: the
# checkout has no `ref`, so it is `main`, never the PR's head, and it takes only .github/scripts
# (the shared description parser, #716) without keeping the token. The PR's text is read from the
# event payload as data. It lets the comment work for PRs from forks too.

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read # the checkout of .github/scripts (the trusted base)
  issues: write

jobs:
  summarize:
    name: Record fix on linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { pathToFileURL } = require('url');
            const { linkedIssues, sectionsOf } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-body.mjs`).href
            );
            const { closes, partOf } = linkedIssues(pr.body);
            if (closes.length + partOf.length === 0) {
              core.info('No linked issues.');
              return;
            }

            const sections = sectionsOf(pr.body);
            const pick = (name) => (sections[name] || '').trim() || '_(not provided)_';
            const comment = (heading) =>
              [
                heading,
                `Merged into \`main\` as ${pr.merge_commit_sha}. Code changes deploy to production automatically (the CI run's "Deploy / …" jobs).`,
                '',
                '**What changed**',
                pick('what changed'),
                '',
                '**How it was fixed**',
                pick('how'),
              ].join('\n');

            const targets = [
              ...closes.map((n) => [n, comment(`### Fixed by #${pr.number}`)]),
              ...partOf.map((n) => [n, comment(`### Progress: #${pr.number} merged (issue stays open)`)]),
            ];
            for (const [number, text] of targets) {
              try {
                await github.rest.issues.createComment({ ...context.repo, issue_number: number, body: text });
                core.info(`Commented on #${number}`);
              } catch (e) {
                core.warning(`Could not comment on #${number}: ${e.message}`);
              }
            }
