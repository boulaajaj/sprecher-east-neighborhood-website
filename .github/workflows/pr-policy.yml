name: PR Policy

# Enforces AGENTS.md steps 1–2 on every pull request: a linked issue with exactly one
# type label, an area label and a priority label, a fully filled-in PR description, and a
# knowledge note updated with the code it describes (.github/scripts/knowledge-sync.mjs).
# Required status check on main ("PR Policy"). Allowed labels: .github/label-policy.json
#
# Note: this runs the PR's own copy of this file. Changes to it (or to any workflow)
# are policy changes and must be called out in review (see .agents/skills/pr-review).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The whole tree: the knowledge check looks for each note named in docs/knowledge/map.json
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.user.login === 'dependabot[bot]') {
              core.info('Dependabot PR: exempt from the issue/description rules (AGENTS.md). Checks and review still apply.');
              return;
            }

            const fs = require('fs');
            const policy = JSON.parse(fs.readFileSync('.github/label-policy.json', 'utf8'));
            const REQUIRED_SECTIONS = ['What changed', 'Why', 'How', 'How to test', 'Risk & rollback', 'Self-review'];
            const SELF_REVIEW_ITEMS = ['Reuse', 'Quality', 'Efficiency', 'Guidelines', 'Visual'];
            const problems = [];
            const { pathToFileURL } = require('url');
            const scripts = (name) => import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/${name}`).href);
            const { linkedIssues, sectionsOf, withoutComments } = await scripts('pr-body.mjs');
            const { changedPaths, knowledgeProblems } = await scripts('knowledge-sync.mjs');
            const body = withoutComments(pr.body);

            // 1. Linked issue(s): "Closes #N" (closes it on merge) or "Part of #N" (multi-PR issue)
            const { closes, partOf } = linkedIssues(body);
            const refs = [...closes, ...partOf];
            if (refs.length === 0) {
              problems.push('Link the issue this PR addresses: "Closes #123" (or "Part of #123" if more PRs will follow).');
            }
            for (const number of refs) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number }));
              } catch {
                problems.push(`#${number} was not found.`);
                continue;
              }
              if (issue.pull_request) {
                problems.push(`#${number} is a pull request, not an issue.`);
                continue;
              }
              const labels = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
              const types = labels.filter((l) => policy.types.includes(l));
              if (types.length !== 1)
                problems.push(`Issue #${number} needs exactly one type label (${policy.types.join(', ')}); it has ${types.length}.`);
              if (!labels.some((l) => policy.areas.includes(l)))
                problems.push(`Issue #${number} needs at least one area label (${policy.areas.join(', ')}).`);
              if (!labels.some((l) => l.startsWith('priority: ')))
                problems.push(`Issue #${number} needs a priority label (priority: high / medium / low).`);
            }

            // 2. Every template section filled in
            const sections = sectionsOf(body);
            for (const name of REQUIRED_SECTIONS) {
              const text = (sections[name.toLowerCase()] || '').replace(/^\s*\d+\.\s*$/gm, '').trim();
              if (text.length < 10) problems.push(`Fill in the "## ${name}" section of the PR description.`);
            }

            // The self-review (docs/guidelines/guard-rails.md, rule 6) says something about each item
            const selfReview = sections['self-review'] || '';
            for (const item of SELF_REVIEW_ITEMS) {
              const line = selfReview.split('\n').find((l) => new RegExp(`^\\s*[-*]\\s*\\**${item}\\**\\s*:`, 'i').test(l));
              const answer = (line || '').replace(/^[^:]*:/, '').trim();
              if (answer.length < 10) problems.push(`Self-review: write a line "- ${item}: what you checked and fixed" (10+ characters).`);
            }

            // 3. The knowledge layer stays in sync with the code (decision 0019 section 6, #716):
            // a change under a mapped path updates its note, or says "Behavior change: none" and why
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            problems.push(
              ...knowledgeProblems({
                mapJson: fs.readFileSync('docs/knowledge/map.json', 'utf8'),
                changedFiles: changedPaths(files),
                noteExists: (note) => fs.existsSync(note),
                body,
              }),
            );

            if (problems.length) {
              core.setFailed(
                `This PR does not meet AGENTS.md yet:\n- ${problems.join('\n- ')}\n\n` +
                  'Fix the issue labels or the PR description, then edit the PR (or re-run this check).',
              );
            } else {
              core.info(`PR Policy passed. Linked issue(s): ${refs.map((n) => '#' + n).join(', ')}`);
            }
