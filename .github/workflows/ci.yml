name: CI

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files via the API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest

    # The job always runs so "Type-check & Build" always reports a result
    # (it is a required check on main). Docs-only changes skip the heavy steps.
    steps:
      - uses: actions/checkout@v6

      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.agents/**'
              - '!docs/**'
              - '!.env.local.example'
              - '!LICENSE'

      - uses: actions/setup-node@v6
        if: steps.filter.outputs.code == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: npm ci

      # `next typegen` writes the route types in .next/types (page, layout and route handler props),
      # which tsconfig.json includes, so `tsc` checks them too (#248)
      - name: Type-check
        if: steps.filter.outputs.code == 'true'
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Unit tests
        if: steps.filter.outputs.code == 'true'
        run: npm test

      - name: Create database tables
        if: steps.filter.outputs.code == 'true'
        run: npx payload migrate
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-build-placeholder-secret-32chars!' }}
          DATABASE_URI: file:./data/payload.db
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: npm run build
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-build-placeholder-secret-32chars!' }}
          DATABASE_URI: file:./data/payload.db
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  # The intelligence agents' prompts, sources, schemas and eval cases (#337): validated against
  # their JSON Schemas, and every field a prompt names must exist. Then the runner's tests, which
  # run the scout and submit evals as code, and an audit of its own dependencies (#364). Skipped
  # when they're untouched.
  intelligence:
    name: Intelligence check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            intelligence:
              - 'intelligence/**'
              - 'scripts/check-intelligence.mjs'
              - 'package-lock.json'

      - uses: actions/setup-node@v6
        if: steps.filter.outputs.intelligence == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            intelligence/runner/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.intelligence == 'true'
        run: npm ci

      - name: Check intelligence/
        if: steps.filter.outputs.intelligence == 'true'
        run: node scripts/check-intelligence.mjs

      - name: Runner tests and audit
        if: steps.filter.outputs.intelligence == 'true'
        working-directory: intelligence/runner
        run: |
          npm ci
          npm test
          npm audit --audit-level=high --omit=dev

  # Pushes to main deploy once the build above has passed; the deploy also waits for the Lint
  # checks (#245). Pull requests skip this job.
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
