language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - '!src/migrations/**'
    - '!src/payload-types.ts'
    - '!src/app/(payload)/admin/importMap.js'
  path_instructions:
    - path: 'src/components/ui/**'
      instructions: |
        Shared UI primitives. Check accessibility and reusable interfaces.
        Do not impose nonexistent features/sections/layout layer boundaries.
    - path: 'src/blocks/**'
      instructions: |
        Payload layout blocks pair collection field configuration with rendering.
        Check that rendered fields match the block schema and generated types.
    - path: 'src/collections/**'
      instructions: |
        Check Payload access control, draft/published behavior, and hooks.
        Flag schema changes for owner approval.
    - path: 'src/access/**'
      instructions: |
        Review authorization boundaries and role checks for least privilege.
    - path: 'src/utilities/**'
      instructions: |
        Shared utilities. Check server/client boundaries and timezone handling.
    - path: '.github/**'
      instructions: |
        CI/CD and GitHub configuration. Review for security implications.
chat:
  auto_reply: true
